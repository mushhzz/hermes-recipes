---
# Provisions a small always-on box (a spare machine, a cheap VPS) to run a
# Hermes gateway plus Claude Code, with an isolated workspace layout so an
# agent session never works directly on a repo's primary checkout.
#
# Usage:
#   cp inventory.example.ini inventory.ini   # fill in your host, user, SSH key
#   ansible-playbook -i inventory.ini playbook.yml
#   ssh <your-user>@<your-host> 'hermes auth'   # complete OAuth login once, by hand
#
# This installs and starts the gateway but does NOT configure any webhook
# routes — do that with the scripts under recipes/*/configure-route.py after
# this playbook has run once.

- name: Set up an agent gateway box (Hermes + Claude Code)
  hosts: agent_box
  become: false
  vars:
    workspace_root: "/home/{{ ansible_user }}/dev"
    node_major_version: "22"
    # Pin these to whatever your own project needs; they are not required by
    # Hermes itself, only by the application repos an agent on this box works in.
    pnpm_version: "10.0.0"
    uv_version: "0.11.0"
    uv_executable: "/usr/local/bin/uv"

  tasks:
    - name: Install base development packages
      become: true
      apt:
        name:
          - build-essential
          - ca-certificates
          - curl
          - git
          - gh
          - jq
          - libmagic1
          - make
          - pkg-config
          - python3
          - python3-dev
          - ripgrep
          - python3-pip
          - python3-venv
          - shellcheck
          - unzip
          - zip
        state: present
        update_cache: true

    # --- Workspace layout ---
    # Hermes has no documented convention for where coding workspaces or
    # per-task git checkouts should live. This is one reasonable layout, not a
    # Hermes standard: separate primary clones from ephemeral per-run ones so
    # a cleanup job can safely sweep the latter without touching the former.
    - name: Create agent workspace layout
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ workspace_root }}"
        - "{{ workspace_root }}/repos"     # primary clones live here
        - "{{ workspace_root }}/worktrees" # ephemeral per-task git worktrees
        - "{{ workspace_root }}/logs"      # agent task logs, separate from ~/.hermes/logs

    # --- Node.js (required by Hermes and the Claude Code CLI) ---
    - name: Check installed Node.js major version
      command: node --version
      register: node_check
      failed_when: false
      changed_when: false

    - name: Install Node.js LTS via NodeSource
      become: true
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x | bash -
        apt-get install -y nodejs
      when: node_check.rc != 0 or not node_check.stdout.startswith('v' ~ node_major_version ~ '.')

    - name: Enable Corepack package-manager shims
      become: true
      command: corepack enable
      changed_when: false

    # --- Claude Code CLI ---
    - name: Check for existing Claude Code CLI
      command: claude --version
      register: claude_check
      failed_when: false
      changed_when: false

    - name: Install Claude Code CLI
      become: true
      npm:
        name: "@anthropic-ai/claude-code"
        global: true
      when: claude_check.rc != 0

    # --- Hermes ---
    - name: Check for existing Hermes install
      command: hermes --version
      register: hermes_check
      failed_when: false
      changed_when: false
      environment:
        PATH: "/home/{{ ansible_user }}/.local/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Run official Hermes installer
      shell: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-setup
      when: hermes_check.rc != 0
      args:
        creates: "/home/{{ ansible_user }}/.local/bin/hermes"

    - name: Ensure ~/.hermes directory exists
      file:
        path: "/home/{{ ansible_user }}/.hermes"
        state: directory
        mode: "0700"

    - name: Bootstrap Hermes .env when absent
      template:
        src: templates/hermes.env.j2
        dest: "/home/{{ ansible_user }}/.hermes/.env"
        mode: "0600"
        force: false
      no_log: true

    - name: Bootstrap Hermes config.yaml when absent
      template:
        src: templates/hermes-config.yaml.j2
        dest: "/home/{{ ansible_user }}/.hermes/config.yaml"
        mode: "0600"
        force: false

    - name: Check for the Hermes gateway systemd unit
      stat:
        path: /etc/systemd/system/hermes-gateway.service
      register: gateway_unit

    - name: Install the Hermes gateway as a systemd service
      become: true
      command: >
        /home/{{ ansible_user }}/.local/bin/hermes gateway install
        --system --run-as-user {{ ansible_user }} --start-now --start-on-login
      when: not gateway_unit.stat.exists

    - name: Start and enable the Hermes gateway service
      become: true
      systemd:
        name: hermes-gateway.service
        state: started
        enabled: true
        daemon_reload: true

    # Any recipe under recipes/ that clones the repo per-run relies on this to
    # keep the primary-clones directory from growing forever.
    - name: Install ephemeral checkout cleanup cron job
      cron:
        name: Agent ephemeral checkout cleanup
        minute: "17"
        hour: "4"
        job: >-
          find {{ workspace_root }}/repos -maxdepth 1 -type d
          \( -name "rca-*" -o -name "issue-*" \)
          -mmin +1440 -exec rm -rf {} +
